<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics of JavaScript</title>
    <script>
    
        function showAlert() {
            alert("Hello! This is a basic JavaScript example.");
        }
    </script>
</head>
<body>
    <h1>Welcome to the Basics of JavaScript</h1>
    <button onclick="showAlert()">Click Me!</button>
    <p>This is a simple JavaScript example.</p>
</body>
</html>
