<!DOCTYPE html>
<html>
<head>
    <title>Multiplication</title>
</head>
<body>

<script>
function multiply(a, b) {
    return a * b;
}

let x = Number(prompt("Enter first number:"));
let y = Number(prompt("Enter second number:"));

let result = multiply(x, y);

document.write("Multiplication = " + result);
</script>

</body>
</html>
